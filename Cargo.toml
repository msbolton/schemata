[package]
name = "schemata"
version = "1.1.0"
edition = "2021"
description = "Schema converter with a rich intermediary language (XSD, Protocol Buffers, .schemata)"
license = "MIT"
repository = "https://github.com/msbolton/schemata"
homepage = "https://github.com/msbolton/schemata"
readme = "README.md"
keywords = ["xsd", "protobuf", "niem", "schema", "converter"]
categories = ["command-line-utilities", "encoding"]

[dependencies]
roxmltree = "0.20"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
