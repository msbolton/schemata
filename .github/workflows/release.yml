name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: ${{ matrix.cross && 'cross' || 'cargo' }} build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../schemata-${{ github.ref_name }}-${{ matrix.target }}.tar.gz schemata
          cd ../../..

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/schemata.exe -DestinationPath schemata-${{ github.ref_name }}-${{ matrix.target }}.zip

      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        run: shasum -a 256 schemata-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }} > schemata-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = (Get-FileHash schemata-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }} -Algorithm SHA256).Hash.ToLower()
          "$hash  schemata-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}" | Out-File -Encoding ascii schemata-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: schemata-${{ matrix.target }}
          path: |
            schemata-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
            schemata-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            schemata-*
